schemaVersion: 1
lanes:
  chore:
    class: build
    match: { kind: chore }
    priority: 100
    gateless: true
    budget: { fixRounds: 2, maxWallSeconds: 2700, maxCostUsd: 8 }
    stages:
      - { name: scope-check, host: scope-check, locked: true, gates: [scope-report] }
      - { name: plan, agent: planner, mode: approach, gates: ["sections:plan.md:Files to touch,Steps,Verify"], onFail: "escalate:needs-decision" }
      - { name: steer, human: true, packet: steer-packet, locked: true, onFail: "escalate:needs-decision" }
      - { name: implement, agent: implementer, verify: true, maxVerifyLoops: 1, gates: [snapshot, manifest, stuck-detector], onFail: fix-round }
      - { name: test, host: checks, locked: true, gates: [test-infra-restore, checks-green, flaky-rerun, finalize], onFail: fix-round }
      - { name: review, agent: reviewer, gates: [citations, verdict-consistent, scope-report], onFail: fix-round, maxRounds: 1 }
      - { name: security, agent: security-auditor, when: "tier == 'elevated' || diff.touches(securityPaths)", onFail: fix-round, maxRounds: 1 }
      - { name: judge, agent: judge, safetyGating: true, locked: true, gates: [evidence-signed, no-synthesized, checklist, ac-spotcheck], onFail: fix-round }
      - { name: publish, host: publish, locked: true, gates: [head-is-judged-sha, preflight, no-generated-docs], onFail: "escalate:publish-refused" }
    onExhausted: escalate

  bug:
    class: build
    match: { kind: bug }
    priority: 100
    budget: { fixRounds: 3, maxWallSeconds: 5400, maxCostUsd: 20 }
    stages:
      - { name: diagnose, agent: root-cause-debugger, when: "brief.reproSteps == 'absent'", gates: ["sections:diagnosis.md:Hypothesis,Reproduction,Suspect files"] }
      - { name: plan, agent: planner, mode: approach, gates: ["sections:plan.md:Files to touch,Steps,Verify"], onFail: "escalate:needs-decision" }
      - { name: gate, agent: tester, mode: gate-writer, locked: true, gates: [red-baseline, "snapshot:testDir", manifest-record], onFail: "escalate:gate-invalid" }
      - { name: steer, human: true, packet: steer-packet, locked: true, onFail: "escalate:needs-decision" }
      - { name: implement, agent: implementer, verify: true, maxVerifyLoops: 2, gates: [snapshot, manifest, junit-green, deps-approval, stuck-detector], onFail: fix-round }
      - { name: test, host: checks, locked: true, gates: [test-infra-restore, checks-green, flaky-rerun, finalize], onFail: fix-round }
      - { name: review, agent: reviewer, gates: [citations, verdict-consistent, scope-report], onFail: fix-round }
      - { name: security, agent: security-auditor, when: "tier == 'elevated' || diff.touches(securityPaths)", onFail: fix-round, maxRounds: 1 }
      - { name: judge, agent: judge, safetyGating: true, locked: true, gates: [evidence-signed, no-synthesized, checklist, ac-spotcheck], onFail: fix-round }
      - { name: publish, host: publish, locked: true, gates: [head-is-judged-sha, preflight], onFail: "escalate:publish-refused" }
    onExhausted: escalate

  enhancement:
    class: build
    match: { kind: enhancement }
    priority: 100
    budget: { fixRounds: 3, maxWallSeconds: 7200, maxCostUsd: 30 }
    stages:
      - { name: plan, agent: planner, mode: approach, gates: ["sections:plan.md:Goal,Files to touch,Steps,Verify,Out of scope"], onFail: "escalate:needs-decision" }
      - { name: gate, agent: tester, mode: gate-writer, locked: true, gates: [red-baseline, "snapshot:testDir", manifest-record], onFail: "escalate:gate-invalid" }
      - { name: steer, human: true, packet: steer-packet, locked: true, onFail: "escalate:needs-decision" }
      - { name: implement, agent: implementer, verify: true, maxVerifyLoops: 2, gates: [snapshot, manifest, junit-green, deps-approval, stuck-detector], onFail: fix-round }
      - { name: test, host: checks, locked: true, gates: [test-infra-restore, checks-green, flaky-rerun, finalize], onFail: fix-round }
      - { name: review, agent: reviewer, gates: [citations, verdict-consistent, scope-report], onFail: fix-round }
      - { name: security, agent: security-auditor, when: "tier == 'elevated' || diff.touches(securityPaths)", onFail: fix-round, maxRounds: 1 }
      - { name: judge, agent: judge, safetyGating: true, locked: true, gates: [evidence-signed, no-synthesized, checklist, ac-spotcheck], onFail: fix-round }
      - { name: publish, host: publish, locked: true, gates: [head-is-judged-sha, preflight], onFail: "escalate:publish-refused" }
    onExhausted: escalate

  feature:
    class: build
    match: { kind: feature }
    priority: 100
    budget: { fixRounds: 4, maxWallSeconds: 14400, maxCostUsd: 60 }
    stages:
      - { name: design, agent: architect, when: "size == 'L' || flags.architecture", gates: ["sections:design.md:Components,Interfaces,Data changes,Risks"] }
      - { name: plan, agent: planner, mode: approach, gates: ["sections:plan.md:Goal,Files to touch,Steps,Verify,Out of scope"], onFail: "escalate:needs-decision" }
      - { name: gate, agent: tester, mode: gate-writer, locked: true, gates: [red-baseline, "snapshot:testDir", manifest-record], onFail: "escalate:gate-invalid" }
      - { name: steer, human: true, packet: steer-packet, locked: true, onFail: "escalate:needs-decision" }
      - { name: implement, agent: implementer, verify: true, maxVerifyLoops: 3, gates: [snapshot, manifest, junit-green, deps-approval, stuck-detector], onFail: fix-round }
      - { name: test, host: checks, locked: true, gates: [test-infra-restore, checks-green, flaky-rerun, finalize], onFail: fix-round }
      - { name: review, agent: reviewer, gates: [citations, verdict-consistent, scope-report], onFail: fix-round }
      - { name: security, agent: security-auditor, when: "tier == 'elevated' || diff.touches(securityPaths)", onFail: fix-round, maxRounds: 1 }
      - { name: judge, agent: judge, safetyGating: true, locked: true, gates: [evidence-signed, no-synthesized, checklist, ac-spotcheck], onFail: fix-round }
      - { name: publish, host: publish, locked: true, gates: [head-is-judged-sha, preflight], onFail: "escalate:publish-refused" }
    onExhausted: escalate

  grill:
    class: pre-build
    match: { trigger: [grill] }
    priority: 50
    budget: { fixRounds: 1, maxWallSeconds: 3600, maxCostUsd: 6 }
    stages:
      - { name: frame, agent: codebase-cartographer, gates: ["sections:frame.md:Idea,Repo map,Related tickets"] }
      - { name: interrogate, agent: discoverer, mode: grill, maxRounds: 4 }
      - { name: spec, agent: architect, gates: ["sections:spec.md:Problem,Approach,Acceptance Criteria,Interfaces,Out of Scope,Open Questions"] }
      - { name: challenge, agent: architect, mode: refute, gates: ["sections:challenge.md:Infeasible,Untestable ACs,Scope creep,Missing NFRs,Cheaper alternative"] }
      - { name: revise, agent: architect, gates: ["sections:spec.md:Problem,Approach,Acceptance Criteria,Interfaces,Out of Scope,Open Questions"] }
      - { name: plan, agent: planner, mode: approach, gates: ["sections:plan.md:Goal,Files to touch,Steps,Verify,Out of scope"] }
      - { name: handoff, human: true, packet: handoff, locked: true }
    onExhausted: escalate

  codify:
    class: meta
    match: { trigger: [script-seed, post-landed, schedule, on-demand, verifier-gaps, rule-check] }
    priority: -10
    budget: { fixRounds: 1, maxWallSeconds: 1800, maxCostUsd: 6 }
    stages:
      - { name: mine,     host: codify-mine,   gates: [evidence-signatures-verified, candidates-schema, candidates-nonempty], onFail: continue, locked: true }
      - { name: assess,   agent: codifier, mode: assess, fusion: { mode: adversarial, slots: [A, B] },
          gates: [assessment-schema, rubric-hard, oracles-select-observed-branches, provenance-reproduces-members], onFail: "escalate:not-codifiable" }
      - { name: generate, agent: codifier, mode: generate, maxRounds: 3,
          gates: [staged-layout, header-template, no-fixture-edits, lint-clean, skill-rendered], onFail: fix-round }
      - { name: validate, host: codify-validate,
          gates: [lint-clean, dev-fixtures, sealed-fixtures, idempotent, deterministic, smoke-current-base, checks-green, matcher-overlap], onFail: fix-round, locked: true }
      - { name: review,   agent: reviewer, mode: codified, gates: [citations, verdict-consistent, bindings-match-assessment] }
      - { name: security, agent: security-auditor, mode: codified, when: "true",
          gates: [deps-allowlist, deps-locked, no-hidden-unicode, no-network-ast, skill-injection-screen], locked: true }
      - { name: judge,    agent: judge, mode: approve-codify, safetyGating: true,
          gates: [evidence-signed, no-synthesized, all-fixtures-pass, lint-clean, manifest-sha-matches, fusion-matches-lane], locked: true }
      - { name: publish,  host: codify-publish, gates: [head-is-judged-sha, preflight, artifact-sha-matches-judged], locked: true }
    publish: { draft: "writeGlobs ∩ src", labels: [factory:codified], titleTemplate: "chore(codified): add {name} v{version}" }
    onExhausted: escalate
